name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # Every uv command fails instead of re-locking if uv.lock is out of date with pyproject.toml.
      UV_LOCKED: "1"
    steps:
      # Actions are pinned to full commit SHAs and uv to the Dockerfile's version (see deploy-space.yml).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.32"
          python-version: "3.11"
          enable-cache: true

      - name: Install Tesseract OCR (document-intelligence tests run real OCR on SYNTHETIC scanned pages)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Install dependencies from the lockfile
        run: uv sync --locked

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test (pytest)
        run: uv run pytest

  # Phase 6 D: release gate. Compares the committed results/*.json with the reviewed baseline in results/baseline/
  # (rows, directions and tolerances: the `gate:` section of config/release_gate.yaml) and fails on any FAIL or MISSING
  # row. Offline: it reads committed JSON only; no data download, model or LLM. It runs after lint-and-test, so a
  # passing gate also means the containment tests (tests/security/test_containment.py) passed.
  release-gate:
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.32"
          python-version: "3.11"
          # Restores the environment lint-and-test cached (same uv.lock key); that job finished first, so the key
          # already exists and this job does not save a cache of its own.
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: uv sync --locked

      - name: Release gate (committed results vs results/baseline)
        run: make release-gate

  # Studio S8: known vulnerabilities in the locked Python dependencies. Fails on any finding (accepted ones are listed,
  # with a reason, in PIP_AUDIT_IGNORE in the Makefile). Needs only uv, not the project's environment: pip-audit and
  # its dependencies come from tools/pip-audit/requirements.txt, each pinned with SHA-256 hashes.
  audit-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.32"
          python-version: "3.11"
          # Off: the cache key does not name the job, so this job would otherwise save a near-empty cache under the
          # key that lint-and-test restores its environment from.
          enable-cache: false

      - name: Audit the locked dependencies (pip-audit)
        run: make audit-deps

  # Studio S8: secrets anywhere in the git history (gitleaks, pinned release, SHA-256 checked; see .gitleaks.toml).
  scan-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # The whole history, not only the last commit, so every commit is scanned (merge commits too: the Makefile
          # passes -m to git log, see GITLEAKS_LOG_OPTS).
          fetch-depth: 0

      - name: Scan every commit, merge commits included, for secrets (gitleaks)
        run: make scan-secrets
