[project]
name = "uwcopilot"
version = "0.1.0"
description = "Underwriting copilot for small-business loans and commercial insurance (portfolio project, public and synthetic data only)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=1.13.0",
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.2",
    "duckdb>=1.5.6",
    "faker>=40.43.0",
    "fastapi>=0.143.0",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.33.0",
    "joblib>=1.6.0",
    "kaggle>=1.6",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph>=1.2.14",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mcp>=2.3.0",
    "metaphone>=0.6",
    "mlflow>=3.17.0",
    "networkx>=3.3",
    "numpy>=2.4.6",
    "openai>=3.28.0",
    "openinference-semantic-conventions>=0.1.41",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "pydantic>=2.14.0",
    "pypdf>=6.20.0",
    "pypdfium2>=4.30",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "rapidfuzz>=3.14.6",
    "reportlab>=4.2",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "scipy>=1.17.1",
    "shap>=0.51.0",
    "statsmodels>=0.15.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.100",
    "pytest>=8.3",
    "respx>=0.23.1",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uwcopilot"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests"]
addopts = '-q -m "not integration"'
markers = [
    "integration: needs downloaded data in data/raw or real embedding models; excluded by default (make test-integration)",
]
