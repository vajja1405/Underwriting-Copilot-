# LLM prices used by src/uwcopilot/llm/budget.py to enforce MAX_RUN_COST_USD and to report cost per call.
#
# Units: US dollars per million tokens (MTok), standard (non-batch) API rates, no prompt caching.
# Rules (CLAUDE.md ground rules 1 and 4):
#   - Every price is copied from the provider's official pricing page given in `source`, on `checked_on`.
#   - Never guess. If a price cannot be verified, set it to null: the model's cost becomes "not measured"
#     and paid calls to it are refused, because the cost cap could not be enforced.
#   - Re-check before relying on these numbers; prices change.
# `long_context` holds the higher prices that apply when the prompt has more than `above_input_tokens` tokens.
# The fake provider used in tests is always free and needs no entry here.
# Local models (provider: ollama) run on this machine: there is no API charge, so their prices are 0.0 and the
# `source` says so instead of naming a pricing page. Their CPU time is reported separately (latency, durations).
# Ids are the local names given by scripts/fetch_local_model.py (see config/generation_eval.yaml for digests).

models:
  claude-haiku-5-5:
    provider: anthropic
    input_usd_per_mtok: 0.10
    output_usd_per_mtok: 0.50
    long_context:
      above_input_tokens: 100000
      input_usd_per_mtok: 0.50
      output_usd_per_mtok: 2.50
    source: https://platform.claude.com/docs/en/about-claude/pricing
    checked_on: "2026-10-10"

  claude-sonnet-5-5:
    provider: anthropic
    input_usd_per_mtok: 2.00
    output_usd_per_mtok: 10.00
    source: https://platform.claude.com/docs/en/about-claude/pricing
    checked_on: "2026-10-10"

  claude-opus-5-5:
    provider: anthropic
    input_usd_per_mtok: 4.00
    output_usd_per_mtok: 20.00
    source: https://platform.claude.com/docs/en/about-claude/pricing
    checked_on: "2026-10-10"

  gpt-6-luna:
    provider: openai
    input_usd_per_mtok: 0.10
    output_usd_per_mtok: 0.50
    long_context:
      above_input_tokens: 272000
      input_usd_per_mtok: 0.20
      output_usd_per_mtok: 0.75
    source: https://developers.openai.com/api/docs/pricing
    checked_on: "2026-10-10"

  gpt-6-sol:
    provider: openai
    input_usd_per_mtok: 2.00
    output_usd_per_mtok: 10.00
    long_context:
      above_input_tokens: 272000
      input_usd_per_mtok: 4.00
      output_usd_per_mtok: 15.00
    source: https://developers.openai.com/api/docs/pricing
    checked_on: "2026-10-10"

  qwen2.5-3b-instruct-q4km:
    provider: ollama
    input_usd_per_mtok: 0.0
    output_usd_per_mtok: 0.0
    source: "local inference via Ollama; no API charge (CPU time reported separately)"
    checked_on: "2026-10-12"

  qwen2.5-1.5b-instruct-f16:
    provider: ollama
    input_usd_per_mtok: 0.0
    output_usd_per_mtok: 0.0
    source: "local inference via Ollama; no API charge (CPU time reported separately)"
    checked_on: "2026-10-12"

# AWS Bedrock (provider: bedrock, src/uwcopilot/llm/bedrock_client.py): NO ENTRY YET, on purpose.
# Bedrock has its own price list (per model and per region). The claude-* entries above are Anthropic API prices and
# are never used for Bedrock: Bedrock model ids are different strings, so they cannot match by accident.
# No Bedrock price has been checked for this repository, so there is no Bedrock entry and the budget layer refuses
# every Bedrock call with PriceNotVerified before any request is sent. To allow one model, add an entry keyed by the
# EXACT id given in UWC_BEDROCK_MODEL (model id or inference profile id), with both prices copied from
# https://aws.amazon.com/bedrock/pricing/ for the region in UWC_BEDROCK_REGION, and the date they were checked:
#   <exact Bedrock model id>:
#     provider: bedrock
#     input_usd_per_mtok: null    # stays null (calls refused) until copied from the pricing page
#     output_usd_per_mtok: null
#     source: https://aws.amazon.com/bedrock/pricing/ (name the region)
#     checked_on: "YYYY-MM-DD"
