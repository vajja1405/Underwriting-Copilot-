# Metro config (Founder Studio S1). Schema: src/uwcopilot/studio/metros/models.py.
# SYNTHETIC: a generated city (src/uwcopilot/studio/data/synthetic_city.py), not a real place. It is placed in open
# ocean on purpose so its coordinates can never be mistaken for a real neighborhood. The app, the tests and the S2/S3
# validations use it until real data snapshots exist; every page and result that uses it says SYNTHETIC.
id: synthetic_metro
