crs: EPSG:4326
bbox: null
trade_area:
  ring_multiplier: 1.0
  status: DESIGN_CHOICE
  note: The generated city is scaled so the profiles' default rings apply unchanged.
enhancements: []
snapshot_date: null
coverage_threshold: 0.8
synthetic:
  seed: 20261012
  n_tracts: 300
  origin_lat: 10.0
  origin_lon: -140.0
  extent_miles: 25
  note: Generator settings are design choices of the project author, not data. Changing the seed gives a different city.
note: SYNTHETIC metro for demonstration and validation. No real place, person or business is represented.
