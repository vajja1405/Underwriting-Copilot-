# Business-type profile (Founder Studio S1). Schema: src/uwcopilot/studio/profiles/models.py.
# EVERY number below is an ASSUMPTION of the project author: a deliberately wide range, user-editable in the app,
# with a note naming the source that should replace it. Nothing is SOURCED: no primary source has been opened and
# cited for these numbers yet. A test fails if any field is marked SOURCED (see tests/studio/test_profiles.py).
id: motel
display_name: Motel / small hotel

naics:
  - code: "721110"
    title: Hotels (except casino hotels) and motels
    verified: true
    verification:
      publisher: U.S. Bureau of Labor Statistics, Quarterly Census of Employment and Wages
      list_name: QCEW industry titles (industry_titles.csv)
      url: https://data.bls.gov/cew/doc/titles/industry/industry_titles.csv
      retrieved_at_utc: "2026-10-13T14:31:09+00:00"
      sha256: facc122ef582f3efdbb5294f103331894d8fdab694de38e4ee7bff1b941ab8e1
      published_title: NAICS 721110 Hotels (except casino hotels) and motels
    note: Code and title found in the BLS QCEW industry titles list (scripts/studio_verify_naics.py -> results/studio_naics_check.json). The list confirms the code exists with this title; choosing it for this business type is the author's judgement.

demand_unit: room-nights/day
demand:
  formula: rooms_occupancy
  inputs:
    rooms:
      low: 20
      mode: 40
      high: 80
      unit: rooms
      status: ASSUMPTION
      source: null
      note: Founder input (the property's room count); this range is only the default.
    occupancy:
      low: 0.40
      mode: 0.62
      high: 0.85
      unit: share of rooms sold per night
      status: ASSUMPTION
      source: null
      note: Market occupancy data is usually paid; replace with the property's history or a cited public tourism report for the metro.

price:
  low: 55
  mode: 95
  high: 180
  unit: USD per room-night (ADR)
  status: ASSUMPTION
  source: null
  note: Replace with the property's rate history or a cited public tourism report for the metro.

capacity:
  max_demand:
    low: 20
    mode: 40
    high: 80
    unit: room-nights/day
    status: ASSUMPTION
    source: null
    note: Equals the room count (founder input); this range is only the default.
  basis: rooms (one room-night per room per day)

hours:
  hours_per_day:
    low: 8
    mode: 24
    high: 24
    unit: front-desk hours/day
    status: ASSUMPTION
    source: null
    note: Founder input; this range is only the default.
  days_per_week:
    low: 6
    mode: 7
    high: 7
    unit: days/week
    status: ASSUMPTION
    source: null
    note: Founder input; this range is only the default.

cost_ratios:
  cogs:
    low: 0.0
    mode: 0.03
    high: 0.08
    unit: share of revenue
    status: ASSUMPTION
    source: null
    note: Breakfast and amenities; replace with supplier quotes.
  utilities:
    low: 0.04
    mode: 0.07
    high: 0.12
    unit: share of revenue
    status: ASSUMPTION
    source: null
    note: Replace with the property's utility bills or the local utility's published tariffs (cited).
  supplies:
    low: 0.02
    mode: 0.04
    high: 0.07
    unit: share of revenue
    status: ASSUMPTION
    source: null
    note: Linens and toiletries; replace with supplier quotes.
  marketing:
    low: 0.03
    mode: 0.08
    high: 0.18
    unit: share of revenue
    status: ASSUMPTION
    source: null
    note: Includes online travel agency commissions; replace with the founder's channel contracts.
  insurance:
    low: 0.01
    mode: 0.03
    high: 0.05
    unit: share of revenue
    status: ASSUMPTION
    source: null
    note: Replace with an insurance quote.
  maintenance:
    low: 0.03
    mode: 0.06
    high: 0.10
    unit: share of revenue
    status: ASSUMPTION
    source: null
    note: Replace with the property's history or a cited lodging cost survey.

labor:
  paid_hours_per_month:
    low: 500
    mode: 1400
    high: 3000
    unit: paid staff hours per month
    status: ASSUMPTION
    source: null
    note: Housekeeping and front desk; founder's staffing plan.
  hourly_wage:
    low: 12
    mode: 16
    high: 24
    unit: USD/hour
    status: ASSUMPTION
    source: null
    note: Replace with BLS QCEW average weekly wage for NAICS 721110 in the metro (hours conversion stated) or BLS OEWS for the metro.

rent:
  handling: founder_quote_else_metro_range
  monthly_rent:
    low: 4000
    mode: 12000
    high: 35000
    unit: USD/month (lease, or the owner's occupancy cost)
    status: ASSUMPTION
    source: null
    note: No free commercial-rent source. The founder's quote comes first; otherwise a metro range with a cited source if one is found.
  annual_escalation:
    low: 0.0
    mode: 0.03
    high: 0.05
    unit: share per year
    status: ASSUMPTION
    source: null
    note: Replace with the escalation clause in the founder's lease.

capex:
  - name: Acquisition or construction
    cost:
      low: 500000
      mode: 2000000
      high: 6000000
      unit: USD
      status: ASSUMPTION
      source: null
      note: Replace with the purchase agreement or contractor quotes.
  - name: Room renovation
    cost:
      low: 100000
      mode: 400000
      high: 1200000
      unit: USD
      status: ASSUMPTION
      source: null
      note: Replace with contractor quotes.
  - name: Furniture, fixtures and equipment
    cost:
      low: 50000
      mode: 200000
      high: 600000
      unit: USD
      status: ASSUMPTION
      source: null
      note: Replace with quotes.
  - name: Property management system, safety systems and signage
    cost:
      low: 10000
      mode: 30000
      high: 80000
      unit: USD
      status: ASSUMPTION
      source: null
      note: Replace with quotes.

seasonality:
  values: [0.8, 0.85, 0.95, 1.0, 1.05, 1.15, 1.25, 1.2, 1.05, 0.95, 0.85, 0.9]
  unit: multiplier on average monthly demand (January to December; mean 1.0)
  status: ASSUMPTION
  source: null
  note: Summer peak is the author's assumption. Replace with the property's history or a cited tourism series, with metro overrides where sourced.

ramp_up:
  starting_share:
    low: 0.5
    mode: 0.7
    high: 0.9
    unit: share of mature demand in the first month
    status: ASSUMPTION
    source: null
    note: No public source identified; an acquired operating motel may start near maturity.
  months_to_maturity:
    low: 3
    mode: 9
    high: 18
    unit: months
    status: ASSUMPTION
    source: null
    note: No public source identified; calibrate from outcome data (S9) once it exists.

design:
  status: DESIGN_CHOICE
  note: Scoring-method choices by the project author, not facts. Weights are not tuned; S2 decided against fitting them to the SYNTHETIC metro (docs/studio/walkthrough_s2.md).
  trade_area_rings_miles: [1, 3, 10]
  location_weights:
    traffic_aadt: {weight: 0.25, direction: higher_is_better}
    tourism: {weight: 0.30, direction: higher_is_better}
    competition: {weight: 0.25, direction: lower_is_better}
    anchors: {weight: 0.10, direction: higher_is_better}
    commercial_rent: {weight: 0.10, direction: lower_is_better}

competitor_tags: [tourism=motel, tourism=hotel, tourism=guest_house]
anchor_tags: [highway=motorway_junction, aeroway=aerodrome, amenity=hospital, leisure=stadium, amenity=university]

key_risks:
  - Occupancy and rate swings
  - Competition, including short-term rentals
  - High fixed costs and renovation needs
  - Labor
  - Local lodging rules and taxes (checked per city with a cited source)

metro_overrides: {}
