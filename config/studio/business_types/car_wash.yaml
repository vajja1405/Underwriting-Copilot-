# Business-type profile (Founder Studio S1). Schema: src/uwcopilot/studio/profiles/models.py.
# EVERY number below is an ASSUMPTION of the project author: a deliberately wide range, user-editable in the app,
# with a note naming the source that should replace it. Nothing is SOURCED: no primary source has been opened and
# cited for these numbers yet. A test fails if any field is marked SOURCED (see tests/studio/test_profiles.py).
id: car_wash
display_name: Car wash (express tunnel and self-serve)

naics:
  - code: "811192"
    title: Car washes
    verified: true
    verification:
      publisher: U.S. Bureau of Labor Statistics, Quarterly Census of Employment and Wages
      list_name: QCEW industry titles (industry_titles.csv)
      url: https://data.bls.gov/cew/doc/titles/industry/industry_titles.csv
      retrieved_at_utc: "2026-10-13T14:31:09+00:00"
      sha256: facc122ef582f3efdbb5294f103331894d8fdab694de38e4ee7bff1b941ab8e1
      published_title: NAICS 811192 Car washes
    note: Code and title found in the BLS QCEW industry titles list (scripts/studio_verify_naics.py -> results/studio_naics_check.json). The list confirms the code exists with this title; choosing it for this business type is the author's judgement.

demand_unit: cars/day
demand:
  formula: aadt_capture
  inputs:
    capture_rate:
      low: 0.002
      mode: 0.006
      high: 0.015
      unit: share of the frontage road's AADT that stops to wash
      status: ASSUMPTION
      source: null
      note: No public source identified; calibrate from founder or outcome data (S9). Industry capture-rate studies are usually paid.

price:
  low: 8
  mode: 14
  high: 25
  unit: USD per car (blend of single washes and memberships)
  status: ASSUMPTION
  source: null
  note: Replace with the founder's price menu and an assumed membership mix.

capacity:
  max_demand:
    low: 150
    mode: 600
    high: 1500
    unit: cars/day
    status: ASSUMPTION
    source: null
    note: Replace with the equipment maker's rated throughput x open hours (express) or bays x cars per bay-hour (self-serve).
  basis: tunnel conveyor throughput x open hours (express), or bays x cars per bay-hour (self-serve)

hours:
  hours_per_day:
    low: 10
    mode: 12
    high: 14
    unit: hours/day
    status: ASSUMPTION
    source: null
    note: Founder input; this range is only the default.
  days_per_week:
    low: 6
    mode: 7
    high: 7
    unit: days/week
    status: ASSUMPTION
    source: null
    note: Founder input; this range is only the default.

cost_ratios:
  cogs:
    low: 0.0
    mode: 0.02
    high: 0.05
    unit: share of revenue
    status: ASSUMPTION
    source: null
    note: Retail add-ons only; chemicals are under supplies. Replace with supplier quotes.
  utilities:
    low: 0.05
    mode: 0.09
    high: 0.15
    unit: share of revenue
    status: ASSUMPTION
    source: null
    note: Water, sewer and electricity; replace with the local utility's published tariffs (cited) and the equipment's usage.
  supplies:
    low: 0.04
    mode: 0.08
    high: 0.12
    unit: share of revenue
    status: ASSUMPTION
    source: null
    note: Chemicals and towels; replace with supplier quotes.
  marketing:
    low: 0.01
    mode: 0.03
    high: 0.06
    unit: share of revenue
    status: ASSUMPTION
    source: null
    note: Founder's marketing plan; no public benchmark identified.
  insurance:
    low: 0.01
    mode: 0.02
    high: 0.04
    unit: share of revenue
    status: ASSUMPTION
    source: null
    note: Replace with an insurance quote.
  maintenance:
    low: 0.03
    mode: 0.06
    high: 0.10
    unit: share of revenue
    status: ASSUMPTION
    source: null
    note: Equipment maintenance; replace with the equipment maker's service contract quote.

labor:
  paid_hours_per_month:
    low: 300
    mode: 1000
    high: 2500
    unit: paid staff hours per month
    status: ASSUMPTION
    source: null
    note: Founder's staffing plan (more for a tunnel than for self-serve).
  hourly_wage:
    low: 12
    mode: 16
    high: 24
    unit: USD/hour
    status: ASSUMPTION
    source: null
    note: Replace with BLS QCEW average weekly wage for NAICS 811192 in the metro (hours conversion stated) or BLS OEWS for the metro.

rent:
  handling: founder_quote_else_metro_range
  monthly_rent:
    low: 3000
    mode: 9000
    high: 25000
    unit: USD/month (building or ground lease)
    status: ASSUMPTION
    source: null
    note: No free commercial-rent source. The founder's quote comes first; otherwise a metro range with a cited listing survey if one is found.
  annual_escalation:
    low: 0.0
    mode: 0.03
    high: 0.05
    unit: share per year
    status: ASSUMPTION
    source: null
    note: Replace with the escalation clause in the founder's lease or quote.

capex:
  - name: Land preparation, site work and building
    cost:
      low: 300000
      mode: 1200000
      high: 3000000
      unit: USD
      status: ASSUMPTION
      source: null
      note: Replace with contractor quotes.
  - name: Wash equipment (tunnel conveyor or self-serve bays)
    cost:
      low: 150000
      mode: 600000
      high: 1500000
      unit: USD
      status: ASSUMPTION
      source: null
      note: Replace with equipment quotes.
  - name: Vacuums and pay stations
    cost:
      low: 20000
      mode: 80000
      high: 200000
      unit: USD
      status: ASSUMPTION
      source: null
      note: Replace with equipment quotes.
  - name: Water reclaim system
    cost:
      low: 10000
      mode: 50000
      high: 150000
      unit: USD
      status: ASSUMPTION
      source: null
      note: Replace with equipment quotes; local water rules to be cited per city.
  - name: Signage and permits
    cost:
      low: 10000
      mode: 40000
      high: 120000
      unit: USD
      status: ASSUMPTION
      source: null
      note: Replace with quotes and the city's fee schedule (cited).

seasonality:
  values: [0.9, 0.9, 1.1, 1.1, 1.05, 1.0, 0.95, 0.95, 0.95, 1.0, 0.95, 1.15]
  unit: multiplier on average monthly demand (January to December; mean 1.0)
  status: ASSUMPTION
  source: null
  note: The shape is the author's assumption. Car-wash demand likely depends on weather, and the plan has no weather source yet (open question B4). Replace with the founder's history or a sourced series.

ramp_up:
  starting_share:
    low: 0.3
    mode: 0.5
    high: 0.7
    unit: share of mature demand in the first month
    status: ASSUMPTION
    source: null
    note: No public source identified; calibrate from outcome data (S9) once it exists.
  months_to_maturity:
    low: 6
    mode: 12
    high: 24
    unit: months
    status: ASSUMPTION
    source: null
    note: No public source identified; calibrate from outcome data (S9) once it exists.

design:
  status: DESIGN_CHOICE
  note: Scoring-method choices by the project author, not facts. Weights are not tuned; S2 decided against fitting them to the SYNTHETIC metro (docs/studio/walkthrough_s2.md).
  trade_area_rings_miles: [1, 3, 5]
  location_weights:
    traffic_aadt: {weight: 0.35, direction: higher_is_better}
    households: {weight: 0.15, direction: higher_is_better}
    median_household_income: {weight: 0.10, direction: higher_is_better}
    competition: {weight: 0.25, direction: lower_is_better}
    anchors: {weight: 0.10, direction: higher_is_better}
    commercial_rent: {weight: 0.05, direction: lower_is_better}

competitor_tags: [amenity=car_wash]
anchor_tags: [shop=supermarket, shop=mall, highway=motorway_junction, amenity=fuel, shop=car]

key_risks:
  - A competitor opening nearby
  - Weather-driven demand swings
  - Water and utility costs
  - Equipment downtime
  - Zoning and permits (checked per city with a cited source)

metro_overrides: {}
