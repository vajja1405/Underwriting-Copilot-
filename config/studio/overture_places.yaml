# Overture Maps places: the ONE release Studio reads and how a metro's extract is made (Founder Studio, S1 data
# fabric). Read by src/uwcopilot/studio/data/overture_places.py. Facts below were read on 2026-10-13 from the pages
# listed under `sources` (each with its SHA-256 as downloaded); values marked DESIGN_CHOICE are the project author's
# settings, not facts about the data.
release:
  id: "2026-09-23.1"
  release_date: "2026-09-25"
  schema_version: v2.0.0
  public_days_max: 60
  note: >-
    The current release on the Overture release calendar page on 2026-10-13. The page's release table dates
    2026-09-23.1 "25 September 2026" and 2026-09-23.0 "23 September 2026" (re-read 2026-10-13 15:30 UTC), so
    release_date is the date of this patch release. 2026-09-23.1 is a patch of 2026-09-23.0; the release notes say
    the patch fixed GERS ids of the base and building_parts types. The 16 places files carry the same S3 ETags in
    both release paths (listing compared on 2026-10-13). For how long the release stays public and what that means
    for the cached extracts, see license.retention.
  s3_https_base: https://overturemaps-us-west-2.s3.us-west-2.amazonaws.com
  bucket: overturemaps-us-west-2
  places_prefix: release/2026-09-23.1/theme=places/type=place/

extract:
  min_confidence:
    value: 0.5
    status: DESIGN_CHOICE
    note: >-
      Places below this existence confidence are left out. The places guide calls confidence the primary filter for
      junk records and says it is not calibrated across providers, so 0.5 is a filter setting, not a probability.
      Rows without a confidence value are left out too. Change it here; the extract is re-made on the next run.
  exclude_operating_status:
    values: [permanently_closed]
    status: DESIGN_CHOICE
    note: >-
      The schema says a permanently closed place has confidence 0, but the September 2026 data has permanently
      closed rows with high confidence (seen on 2026-10-13 in Houston), so they are excluded explicitly.
  coordinates:
    note: >-
      A place's position is read from its bbox struct (xmin = longitude, ymin = latitude; for a point both corners
      are the point), as the places guide's DuckDB example does, so the WKB geometry column is never downloaded.
      The bbox values differ from the WKB point by under a meter (example row in the schema reference).
  stored_fields:
    note: >-
      Only category, coordinates, confidence, the first source's dataset name and the licenses of all the place's
      sources are stored. Names, ids, addresses, phones, websites and brands are never read or stored.

license:
  summary: >-
    Mixed licenses by source. Per the Overture attribution page (retrieved 2026-10-13), places data from Meta,
    Microsoft, PinMeTo, Krick, RenderSEO, DAC and BrightQuery is available under CDLA Permissive 2.0; data from
    Foursquare is available under Apache 2.0 ("Copyright 2024 Foursquare Labs, Inc. All rights reserved."; the
    Foursquare NOTICE.txt is linked from that page; "Foursquare data was transformed to the Overture schema"); data
    from AllThePlaces is available under CC0 1.0. The places guide says the theme contains no OpenStreetMap data. A
    place's sources list names its provider first and then, for almost every place, Overture's own contributions
    (datasets "Overture" and "Overture-signals", licensed CDLA-Permissive-2.0; seen in live queries of central Houston
    and Manhattan on 2026-10-13), so one place usually mixes two licenses. Each stored place therefore keeps the
    licenses of ALL its sources, sorted and joined with "+" (for example "Apache-2.0+CDLA-Permissive-2.0" for a
    Foursquare place), and the dataset name of its first source. CDLA Permissive 2.0 (text read on 2026-10-13 at
    https://cdla.dev/permissive-2-0/): section 2.1 allows sharing the data if the text of the agreement is made
    available with it; section 3.1 puts no restriction or obligation on Results (outcomes of computational
    analysis, such as Studio's per-tract counts). The Apache 2.0 terms for the Foursquare rows were not read in this
    build; read them (and ship the Foursquare NOTICE) before places.json is shared outside this machine.
  licenses_by_source:
    CDLA-Permissive-2.0: [meta, Microsoft, PinMeTo, Krick, RenderSEO, DAC, BrightQuery]
    Apache-2.0: [Foursquare]
    CC0-1.0: [AllThePlaces]
  attribution: >-
    Overture Maps Foundation, overturemaps.org (the citation the attribution page suggests, with the date the data
    were accessed). Foursquare NOTICE: https://opensource.foursquare.com/places-notice-txt/
  foursquare_notice_url: https://opensource.foursquare.com/places-notice-txt/
  retention: >-
    The release calendar page (re-read 2026-10-13 15:30 UTC) says: "Overture maintains publicly available data
    releases for a maximum of 60 days (two monthly releases) to comply with data protection regulations, including
    GDPR 'right to be forgotten' requirements." Studio's rule (a design choice that follows the same intent and the
    Studio addendum's retention principle): once the pinned release is no longer listed in the bucket, the pin moves
    to a current release and the cached extracts (data/studio/cache) and every snapshot's places.json made from the
    old release are re-made or deleted; they are not kept and reused. In code: release.public_days_max (60, from that
    sentence) after release.release_date, extract_metro_places refuses to build or reuse an extract of the pinned
    release (the overture_places step then fails and the snapshot has no places layer until the pin moves); with a
    fresh listing (--refresh) it also fails as soon as the bucket lists no files for the release. Snapshot folders
    already written are dated records and are not changed by code: delete them (data/studio/snapshots/<metro>/<date>)
    once their release is retired. The extracts hold no names, ids or addresses, only category, position, confidence,
    dataset and licenses, but a position can still point at a home-based business.

